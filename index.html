<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b10">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="ПАНЕЛЬКИ — восьмибитная игра про панельный дом, бомбы, погоду и политические режимы. Режиссёр Алексей Балабанов.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ПАНЕЛЬКИ">

  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" width="320" height="400" aria-label="ПАНЕЛЬКИ — восьмибитная игра про постсоветские панельки"></canvas>

  <div id="hint">ПРОБЕЛ / КЛИК — БРОСИТЬ ПАНЕЛЬ · СВАЙП / ← → — ОТБИТЬ БОМБУ · M — ЗВУК</div>
  <div id="pwa-bar">
    <button id="install" type="button" hidden>УСТАНОВИТЬ ИГРУ</button>
    <span id="ios-install" hidden>IPHONE: «ПОДЕЛИТЬСЯ» → «НА ЭКРАН „ДОМОЙ“»</span>
  </div>
  <script src="js/font.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/art.js"></script>
